name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts-source:
    name: forge test (contracts/source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
        working-directory: contracts/source
      - run: forge test -vvv
        working-directory: contracts/source

  contracts-creditcoin:
    name: forge test (contracts/creditcoin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
        working-directory: contracts/creditcoin
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.7.0 --no-git
        working-directory: contracts/creditcoin
      - run: forge test -vvv
        working-directory: contracts/creditcoin

  typecheck-and-lint:
    name: tsc + lint (apps, packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint
